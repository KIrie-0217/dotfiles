[mgr]
ratio = [0, 1, 0]
sort_by = "natural"
show_hidden = true

[opener]
edit = [
    { run = 'yazi-open.sh "%*"', orphan = true, desc = "Edit in nvim pane", for = "unix" },
]
download = [
    { run = 'yazi-download.sh "%*"', block = true, desc = "Download to local (OSC 1337)", for = "unix" },
]
imgview = [
    { run = 'chafa -f kitty "%*"; read -r', block = true, desc = "View image (chafa)", for = "unix" },
]
open = [
    { run = 'open "%*"', orphan = true, desc = "Open with system", for = "macos" },
    { run = 'xdg-open "%*"', orphan = true, desc = "Open with system", for = "linux" },
]

[open]
prepend_rules = [
    { mime = "image/*", use = ["imgview", "download", "open"] },
    { name = "*.html", use = ["edit", "download", "open"] },
    { name = "*.htm", use = ["edit", "download", "open"] },
    { mime = "text/*", use = ["edit", "download"] },
    { name = "*.md", use = ["edit", "download"] },
    { name = "*.markdown", use = ["edit", "download"] },
    { name = "*", use = ["edit", "download", "open"] },
]
