[mgr]
prepend_keymap = [
    # Astarte navigation: hjkl -> ktns
    { on = "n", run = "arrow -1", desc = "Move cursor up" },
    { on = "t", run = "arrow 1", desc = "Move cursor down" },
    { on = "k", run = "leave", desc = "Go to parent directory" },
    { on = "s", run = "enter", desc = "Enter directory / open file" },

    { on = "N", run = "seek -5", desc = "Seek up in preview" },
    { on = "T", run = "seek 5", desc = "Seek down in preview" },
    { on = "K", run = "back", desc = "Go back in history" },
    { on = "S", run = "forward", desc = "Go forward in history" },

    # Relocate displaced defaults
    { on = "f", run = "find_arrow", desc = "Find next" },
    { on = "F", run = "find_arrow --previous", desc = "Find previous" },

    { on = "P", run = "plugin toggle-preview", desc = "Toggle preview pane" },
]
